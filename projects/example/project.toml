# Example project: the "I'm not a real person" reel (IG Reels, 1080x1920).
# Every path is relative to this folder. See docs/config.md for all options.

[project]
name = "ai-avatar-reel"

[script]
file = "script.txt"          # what the avatar says (English works best with the default voices)
language = "en"

[portrait]
model = "openai/gpt-image-2.5-sunburst"
prompt_file = "prompts/portrait.txt"
aspect_ratio = "9:16"
quality = "high"             # low / medium / high (~$0.01 / ~$0.01 / ~$0.035 per image)
selected = "output/portraits/portrait-20261029-161414-0.png"

[voice]
tts_models = ["heygen/heygen-voice-1-turbo:free", "heygen/heygen-voice-1-turbo"]
voice = "nadine"             # nadine tabitha bram gareth noelle meredith sabrina lucian weston vincent
heygen_voice_id = "83548de556df48ba8c09c42a57c51d85"   # the same voice, as HeyGen's voice ID (used by Avatar IV)

[avatar]
model = "heygen/avatar-iv"
resolution = "1080p"
key_color = "#00FF00"        # Avatar IV renders on this color; it is keyed out in post
expressiveness = ""          # "", "low", "medium" or "high"

[framing]                    # where the face is in the avatar video; check with `framing`
split_scale = 0.55
split_top = 904
feather_top = 1400
feather_ramp = 90
circle_crop = [940, 940, 70, 160]    # [width, height, x, y] square around the head for the circle
compare_crop = [600, 900, 240, 140]  # [width, height, x, y] for the input/output comparison

[captions]
max_chars = 24
max_words = 4
keep_together = [["GPT", "Image"], ["Image", "2.5"], ["Avatar", "IV"], ["HeyGen", "Avatar"],
                 ["OpenRouter", "API"], ["OpenRouter", "key"]]
highlight = ["AI", "OpenAI's", "GPT", "Image", "2.5", "OpenRouter", "API", "HeyGen", "Avatar", "IV"]

[captions.aliases]           # how the transcriber may spell words from the script
heijen = "heygen"
four = "iv"

[ambient]
model = "google/veo-3.1-lite"
prompt_file = "prompts/broll-background.txt"
duration = 8
negative_prompt = "text, letters, watermark, logo, people, faces, hands, objects, furniture, dark colors, high contrast, fast motion, flicker"
opacity = 0.45

[hook]
model = "google/veo-3.1-lite"
prompt_file = "prompts/broll-hook.txt"
duration = 4
negative_prompt = "text, letters, watermark, logo, distorted face, extra people, dark colors, flicker"
end = 1.6                    # the hook covers 0..end seconds; pick a pause in the speech
trim = [0.4, 3.4]            # part of the generated clip to use (sped up to fill 0..end)

[cover]
title = ["I'm not a", "real person."]
subtitle = "AI avatar · OpenRouter + HeyGen"
avatar_at = 1.6
hook_at = 2.0

# ---------------------------------------------------------------- scenes
# layout: full (avatar full screen) | split (card on top, avatar below)
#         pip (card + avatar in a circle) | compare (input photo vs output video)
# start:  a phrase from the script (the scene starts when it is spoken) or seconds.
# at:     when an element appears: a phrase (first time it is spoken in this scene) or seconds.

[[scenes]]
layout = "full"
[[scenes.overlays]]
type = "badge"
text = "100% AI-GENERATED"
at = 0.5
y = 1150

[[scenes]]
layout = "split"
start = "Step one"
[scenes.card]
step = "STEP 1"
title = "The face"
[[scenes.card.blocks]]
type = "code"
label = "prompts/portrait.txt"
text = "Photorealistic vertical portrait photo of a friendly 25-year-old female content creator, filmed like a talking-head video for Instagram. Eyes looking directly into the camera, gentle closed-mouth smile, soft even front lighting, softly blurred home studio background."
[[scenes.card.blocks]]
type = "media"
replace = true
at = "GPT"
image = "@portrait"
tag = "OUTPUT"
title = "portrait.png"
subtitle = "864 × 1536 · PNG"
lines = ["quality  high", "cost     $0.034", "time     ~28 s"]
[[scenes.card.blocks]]
type = "mono"
lines = ["POST /api/v1/images  →  openai/gpt-image-2.5-sunburst"]

[[scenes]]
layout = "split"
start = "Step two"
[scenes.card]
step = "STEP 2"
title = "The voice"
[[scenes.card.blocks]]
type = "quote"
label = "script.txt"
text = "“I'm not a real person. My face and my voice were both generated by AI. Here's the exact pipeline.”"
[[scenes.card.blocks]]
type = "waveform"
audio = "@narration"
[[scenes.card.blocks]]
type = "mono"
lines = ["POST /api/v1/audio/speech  →  heygen/heygen-voice-1-turbo",
         "voice nadine · PCM 44.1 kHz · cost $0 (free tier)"]

[[scenes]]
layout = "pip"
start = "Step three"
[scenes.pip]
tag = "● LIVE"
note = "heygen/avatar-iv output"
[scenes.card]
step = "STEP 3"
title = "Lip-sync video"
[[scenes.card.blocks]]
type = "flow"
model = "heygen/avatar-iv"
model_at = "Avatar"
arrow_at = "animates"
output = "talking video · 1080×1920 · 25 fps"
output_at = "talking"
inputs = [{ image = "@portrait", at = "photo" },
          { tile = "script + voice", sub = "nadine", at = "audio" }]

[[scenes]]
layout = "compare"
start = "Same OpenRouter"
[scenes.compare]
step = "STEP 3"
title = "Input → output"
input_text = "1 photo"
output_text = "lip-synced video"
[[scenes.overlays]]
type = "pills"
y = 1140
size = 34
gap = 24
items = [{ text = "1 OpenRouter key", style = "light", at = "key" },
         { text = "$0.05 / sec", style = "accent", at = "five" }]

[[scenes]]
layout = "full"
start = "One photo"
[[scenes.overlays]]
type = "pills"
items = [{ text = "1 photo", style = "dark", at = "photo" },
         { text = "1 script", style = "dark", at = "script" },
         { text = "1 API", style = "accent", at = "API" }]
